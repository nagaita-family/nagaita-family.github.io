<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <title>Nagaita Family</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f6f7fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(760px,100%)}
    h1{margin:0 0 8px;font-size:clamp(32px,7vw,56px)}
    .lead{margin:0 0 28px;color:#6b7280}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    a{display:block;padding:20px;border-radius:18px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 8px 24px rgba(31,41,55,.08);border:1px solid #e5e7eb}
    a:hover{transform:translateY(-1px)}
    strong{display:block;font-size:18px;margin-bottom:6px}
    span{color:#6b7280;font-size:14px}
    footer{margin-top:22px;color:#9ca3af;font-size:12px}
  </style>
</head>
<body>
  <main>
    <h1>Nagaita Family</h1>
    <p class="lead">Family apps and learning games.</p>
    <div class="grid">
      <a href="/miori-word-garden/"><strong>Miori's Word Garden</strong><span>English spelling & word practice</span></a>
      <a href="/miori-kanji-quest/"><strong>Miori Kanji Quest</strong><span>Kanji learning game</span></a>
      <a href="/miori-spell-garden/"><strong>Miori's Spell Garden</strong><span>Spelling practice</span></a>
      <a href="/kosuke-letter-quest/"><strong>Kosuke Letter Quest</strong><span>Letter learning game</span></a>
    </div>
    <footer>nagaita-family</footer>
  </main>
</body>
</html>
